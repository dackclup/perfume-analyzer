name: Notes data

# Offline check for the per-material note data used by the step-by-step picker (project file 12):
# unit tests, and notes/notes.json + coverage.md must match a fresh build from app/index.html and
# notes/sources/. No network access.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "notes/**"
      - "tools/notes/**"
      - "app/index.html"
      - ".github/workflows/notes-data.yml"
  push:
    branches: ["main"]
    paths:
      - "notes/**"
      - "tools/notes/**"
      - "app/index.html"
      - ".github/workflows/notes-data.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests and up-to-date check
        run: python -m unittest discover -s tools/notes -p 'test_*.py' -v
